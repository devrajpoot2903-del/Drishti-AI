name: Drishti AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Build & Validate Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            aicte-agentic-platform/frontend/package-lock.json
            aicte-agentic-platform/gateway/package-lock.json

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f aicte-agentic-platform/ai-service/requirements.txt ]; then
            pip install -r aicte-agentic-platform/ai-service/requirements.txt
          fi
          pip install reportlab qrcode pymupdf pillow

      - name: Build Fastify API Gateway
        working-directory: aicte-agentic-platform/gateway
        run: |
          npm ci
          npm run build

      - name: Build Next.js Frontend
        working-directory: aicte-agentic-platform/frontend
        run: |
          npm ci
          npm run build
